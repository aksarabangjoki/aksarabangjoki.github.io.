<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0E1A3D">
<meta name="robots" content="noindex,nofollow">
<title>Pesanan Saya · Aksara by Bang Joki</title>
<meta property="og:title" content="Pesanan Saya · Aksara by Bang Joki">
<meta property="og:description" content="File tugas, invoice dan pembayaran, serta pengajuan revisi untuk pesananmu.">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Plus Jakarta Sans",system-ui,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
:root{--n1:#0E1A3D;--n2:#1B2E66;--g1:#C99A3A;--g2:#F3D98E;--bg:#F3F4F8;--ink:#0E1A3D;--mute:#5B6478;--line:#E3E6EF}
body{background:var(--bg);color:var(--ink);min-height:100vh}
.w{max-width:560px;margin:0 auto;padding:0 14px 40px}
.hd{background:radial-gradient(500px 300px at 90% -10%,rgba(243,217,142,.25),transparent 60%),linear-gradient(160deg,#0B1530,#1B2E66 70%,#22397C);color:#fff;padding:22px 18px 70px;position:relative;overflow:hidden}
.hd:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,transparent,var(--g2),transparent)}
.hd .in{max-width:560px;margin:0 auto}
.br{display:flex;align-items:center;gap:12px}
.lg{width:54px;height:54px;border-radius:16px;background:#fff;display:grid;place-items:center;flex:none;box-shadow:0 0 0 2px var(--g1),0 10px 20px -10px rgba(0,0,0,.6)}.lg img{width:48px;height:48px}
.br b{display:block;font-size:16px;letter-spacing:.3px}.br span{display:block;font-size:11.5px;color:var(--g2);font-weight:600;margin-top:2px}
.ttl{margin-top:20px;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--g2)}
.hd h1{font-size:23px;line-height:1.25;margin-top:6px}.hd p{font-size:13.5px;opacity:.88;margin-top:5px}
.sum{position:relative;margin:-52px 0 0;background:#fff;border-radius:22px;padding:16px;box-shadow:0 18px 40px -24px rgba(14,26,61,.6);border:1px solid var(--line)}
.sr{display:flex;gap:10px}.sr>div{flex:1;background:#F7F8FB;border-radius:14px;padding:10px 12px}.sr small{display:block;font-size:11px;color:var(--mute);font-weight:700}.sr b{display:block;font-size:14.5px;margin-top:2px}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;border-radius:99px;padding:5px 12px}
.prog{display:flex;align-items:center;margin-top:14px}.prog div{flex:1;text-align:center;font-size:10.5px;font-weight:700;color:var(--mute);position:relative}
.prog div i{display:block;width:26px;height:26px;border-radius:50%;margin:0 auto 5px;background:#E3E6EF;color:#fff;font-style:normal;font-size:12px;line-height:26px;position:relative;z-index:1}
.prog div:before{content:"";position:absolute;top:12px;left:-50%;width:100%;height:3px;background:#E3E6EF}.prog div:first-child:before{display:none}
.prog div.on i{background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--n1)}.prog div.on:before{background:var(--g1)}.prog div.on{color:var(--ink)}
.msg{margin-top:12px;background:#FFF8E6;border:1px solid #F2D58A;border-radius:14px;padding:10px 12px;font-size:13px;color:#6B4E00;font-weight:600;line-height:1.5}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0}
.tabs button{border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:10px 4px 9px;font-size:12.5px;font-weight:800;color:var(--mute);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;transition:.2s;position:relative}
.tabs button svg{width:22px;height:22px}.tabs button.on{background:linear-gradient(160deg,#0E1A3D,#1B2E66);border-color:transparent;color:#fff;box-shadow:0 10px 20px -12px rgba(14,26,61,.8)}.tabs button.on svg{color:var(--g2)}
.tabs button em{position:absolute;top:6px;right:8px;font-style:normal;background:#E5383B;color:#fff;border-radius:99px;font-size:10px;padding:1px 6px}
.cd{background:#fff;border-radius:20px;padding:16px;margin-top:12px;border:1px solid var(--line);box-shadow:0 10px 26px -22px rgba(14,26,61,.5);animation:mk .35s both}
@keyframes mk{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.h3{font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:space-between;gap:8px}.h3 small{font-size:12px;color:var(--mute);font-weight:600}
.hint{font-size:12.5px;color:var(--mute);margin-top:5px;line-height:1.5}
.doc{display:flex;align-items:center;gap:10px;padding:11px;border:1.5px solid var(--line);border-radius:15px;margin-top:9px}
.doc .i{width:40px;height:40px;border-radius:12px;background:#E9EEF9;color:var(--n2);display:grid;place-items:center;flex:none}.doc .i.k{background:#FFF4D6;color:#A0710F}
.doc .t{flex:1;min-width:0}.doc .t b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.doc .t span{font-size:11.5px;color:var(--mute)}
.ab{flex:none;text-decoration:none;font-size:12px;font-weight:800;border-radius:11px;padding:9px 11px;background:#EEF1F8;color:var(--n2)}.ab.dl{background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--n1);padding:8px 10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:12px;padding:14px;border:0;border-radius:15px;background:linear-gradient(135deg,#0E1A3D,#1B2E66);color:#fff;font-size:14.5px;font-weight:800;cursor:pointer;text-decoration:none}
.btn.gd{background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--n1)}.btn.gh{background:#EEF1F8;color:var(--n2)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:18px;height:18px}
/* invoice */
.inv{border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-top:4px}
.inv-h{background:linear-gradient(135deg,#0E1A3D,#1B2E66);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.inv-h b{font-size:18px;letter-spacing:2px}.inv-h small{display:block;font-size:11.5px;opacity:.8;margin-top:3px}.inv-h .no{text-align:right;font-size:12px;font-weight:700;color:var(--g2)}
.stamp{display:inline-block;margin-top:6px;font-size:11px;font-weight:800;letter-spacing:1.5px;border:2px solid;border-radius:8px;padding:3px 8px}
.it{padding:6px 16px 4px}.ir{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px}.ir:last-child{border-bottom:0}.ir .d{flex:1}.ir .d small{display:block;color:var(--mute);font-size:11.5px;margin-top:2px}.ir .j{font-weight:800;white-space:nowrap}
.tot{background:#F7F8FB;padding:12px 16px}.tot div{display:flex;justify-content:space-between;font-size:13.5px;padding:3px 0}.tot .g{font-size:16px;font-weight:800;border-top:1px solid var(--line);margin-top:6px;padding-top:8px}
.sisa{margin-top:12px;border-radius:16px;padding:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}.sisa b{font-size:20px}.sisa small{display:block;font-size:12px;font-weight:700}
.bar{height:8px;border-radius:8px;background:#E3E6EF;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#2E8A1F,#69C35A)}
.bi{white-space:pre-wrap;font-size:13.5px;line-height:1.6;background:#F7F8FB;border-radius:14px;padding:12px 14px;margin-top:10px;word-break:break-word}.bi a{color:var(--n2);font-weight:700}
/* revisi */
.kq{display:flex;align-items:center;gap:12px;margin-top:4px}.kq .r{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:18px;flex:none;background:conic-gradient(var(--g1) calc(var(--p)*1%),#E3E6EF 0);position:relative}
.kq .r:after{content:"";position:absolute;inset:7px;border-radius:50%;background:#fff}.kq .r span{position:relative;z-index:1;font-size:15px}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}
textarea,input,select{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:13px;font-size:15px;outline:none;background:#fff;color:var(--ink)}
textarea{min-height:110px;resize:vertical;line-height:1.5}textarea:focus,input:focus,select:focus{border-color:var(--g1);box-shadow:0 0 0 3px rgba(201,154,58,.18)}
.g2{display:grid;grid-template-columns:1.25fr 1fr;gap:10px}
.rv{padding:12px 0;border-top:1px dashed var(--line)}.rv:first-of-type{border-top:0}.rv .h{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12px;color:var(--mute);font-weight:700}
.rv p{font-size:14px;margin-top:6px;white-space:pre-wrap;line-height:1.5}.rv a{font-size:12.5px;font-weight:700;color:var(--n2)}
.kc{background:linear-gradient(160deg,#fff,#F6F3FF);border:1.5px solid #E1DAFF;border-radius:20px;padding:18px 16px;margin-bottom:12px;box-shadow:0 14px 28px -20px rgba(27,46,102,.5)}
.kc.geleng{animation:geleng .45s}@keyframes geleng{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.kc-g{position:relative;width:64px;height:64px;margin:0 auto 8px;border-radius:20px;background:linear-gradient(135deg,#1B2E66,#5B3FD1);color:#FFD43B;display:grid;place-items:center;box-shadow:0 12px 24px -10px rgba(91,63,209,.7)}
.kc-bd svg{width:32px;height:32px;display:block}.kc-bd .kait{transform-origin:16px 10.5px;transition:transform .5s cubic-bezier(.2,1.5,.4,1)}.kc-g.buka .kait{transform:translateY(-3px) rotate(28deg)}.kc-g.buka{background:linear-gradient(135deg,#2B8A3E,#40C057);color:#fff}
.kc-sh{position:absolute;inset:-6px;border-radius:24px;border:2px solid rgba(91,63,209,.35);animation:denyut 2s infinite}@keyframes denyut{0%{transform:scale(.92);opacity:1}100%{transform:scale(1.18);opacity:0}}
.kc-in{display:flex;gap:8px;margin-top:12px}.kc-in input{flex:1;min-width:0;text-align:center;font-family:ui-monospace,Menlo,monospace;font-size:20px;font-weight:800;letter-spacing:4px;text-transform:uppercase;border:2px solid #D0BFFF;border-radius:14px;padding:11px 8px;outline:0;color:#1B2E66}.kc-in input::placeholder{color:#B9B2D8;letter-spacing:3px}.kc-in input:focus{border-color:#5B3FD1;box-shadow:0 0 0 4px rgba(91,63,209,.15)}
.kc-in button{flex:none;border:0;border-radius:14px;padding:0 16px;background:linear-gradient(135deg,#0E1A3D,#1B2E66);color:#fff;font-weight:800;font-size:14px;cursor:pointer}.kc-in button:disabled{opacity:.7}
.doc.dk{background:#FBFAFF;border-color:#E1DAFF}.doc .i.kk{background:#F3F0FF;color:#5B3FD1}.doc .i.kk svg{width:20px;height:20px}button.ab{border:0;cursor:pointer;font-family:inherit}
.lv{position:fixed;inset:0;z-index:60;background:rgba(10,14,40,.92);display:flex;flex-direction:column;opacity:0;transition:opacity .25s}.lv.on{opacity:1}
.lv-h{display:flex;align-items:center;gap:10px;padding:12px 14px;color:#fff}.lv-h b{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lv-h span{font-size:11.5px;font-weight:800;background:#5B3FD1;border-radius:99px;padding:4px 10px;white-space:nowrap}
.lv-h button{width:38px;height:38px;border-radius:12px;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:17px;cursor:pointer}
.lv-b{position:relative;flex:1;margin:0 10px 10px;border-radius:14px;overflow:hidden;background:#fff}.lv-b iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.lv-tt{position:absolute;top:0;right:0;width:84px;height:64px;z-index:2}
.lv-wm{position:absolute;inset:-20%;z-index:1;pointer-events:none;display:flex;flex-wrap:wrap;align-content:space-around;justify-content:space-around;transform:rotate(-24deg);opacity:.13}.lv-wm span{font-weight:800;font-size:22px;color:#1B2E66;padding:28px 18px;white-space:nowrap}
.er{background:#FFF0F0;color:#C92A2A;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;margin-top:12px;display:none}
.ok{background:#EBFBEE;color:#2B8A3E;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:700;margin-top:12px}
.em{font-size:13px;color:var(--mute);text-align:center;padding:12px 0}
.ft{text-align:center;font-size:11.5px;color:var(--mute);margin-top:20px}.hp{position:absolute;left:-9999px}
.ld{height:14px;border-radius:7px;background:linear-gradient(90deg,#EEF0F5,#E2E6EE,#EEF0F5);background-size:200% 100%;animation:sh 1.2s infinite;margin:10px 0}@keyframes sh{to{background-position:-200% 0}}
.up{display:flex!important}
</style>
</head>
