<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2B1A6B">
<meta name="robots" content="noindex,nofollow">
<title>Portal Klien · Aksara Bangjoki</title>
<meta property="og:title" content="Portal Klien · Aksara Bangjoki">
<meta property="og:description" content="Pantau progres pengerjaan, buka dokumen dan ajukan revisi skripsi.">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Plus Jakarta Sans",system-ui,Arial,sans-serif}
body{background:#F1EFFA;color:#16122E;min-height:100vh;padding:20px 14px 30px}
.w{max-width:520px;margin:0 auto}
.hd{background:linear-gradient(135deg,#2B1A6B,#5B3CC4 60%,#7C5CE8);color:#fff;border-radius:26px;padding:22px 20px;position:relative;overflow:hidden;box-shadow:0 18px 40px -18px rgba(43,26,107,.7)}
.hd:after{content:"";position:absolute;right:-60px;top:-70px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.08)}
.br{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.hd h1{font-size:21px;font-weight:800;margin-top:6px;line-height:1.25}
.hd .jd{font-size:13.5px;font-weight:600;opacity:.92;margin-top:6px;line-height:1.45}
.hd .km{font-size:12px;opacity:.8;margin-top:4px}
.top{display:flex;gap:16px;align-items:center;margin-top:16px;position:relative;z-index:1}
.ring{flex:none;width:96px;height:96px;position:relative}.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700}
.cd{background:#fff;border-radius:22px;padding:18px;margin-top:14px;box-shadow:0 10px 30px -20px rgba(43,26,107,.45)}
.st{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:#6B6590;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
.msg{background:#FFF8E1;border:1px solid #F3D27A;color:#6B4E00;border-radius:16px;padding:12px 14px;font-size:13.5px;line-height:1.5;margin-top:14px;font-weight:600}
.th{display:flex;gap:12px;align-items:center;padding:9px 0;border-top:1px dashed #E7E3F5}.th:first-of-type{border-top:0}
.no{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:800;flex:none}
.th .t{flex:1;font-size:14px;font-weight:700}.th .d{font-size:11.5px;color:#6B6590;font-weight:600}
.tg{font-size:11px;font-weight:800;border-radius:999px;padding:3px 10px;flex:none}
.doc{display:flex;gap:12px;align-items:center;padding:12px;border:1.5px solid #E2DCF7;border-radius:16px;text-decoration:none;color:inherit;margin-top:8px}
.doc:first-of-type{margin-top:0}.doc .i{width:40px;height:40px;border-radius:12px;background:#E6FCF5;color:#0B7A5C;display:grid;place-items:center;flex:none}
.doc b{font-size:14px;display:block}.doc span{font-size:11.5px;color:#6B6590;word-break:break-all}
.btn{display:block;width:100%;padding:15px;border:0;border-radius:15px;background:#5B3CC4;color:#fff;font-size:15.5px;font-weight:800;cursor:pointer;text-align:center;text-decoration:none}
.btn:disabled{opacity:.55;cursor:not-allowed}.btn.wa{background:#1FAF54;margin-top:10px}.btn.gh{background:#F1EFFA;color:#3A2A85}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}
textarea,input{width:100%;padding:13px 14px;border:1.5px solid #DCD5F2;border-radius:13px;font-size:15px;outline:none;color:#16122E;background:#fff}
textarea{min-height:120px;resize:vertical}textarea:focus,input:focus{border-color:#5B3CC4;box-shadow:0 0 0 3px rgba(91,60,196,.15)}
.hint{font-size:12px;color:#6B6590;margin-top:5px;line-height:1.4}
.rv{padding:12px 0;border-top:1px dashed #E7E3F5}.rv:first-of-type{border-top:0;padding-top:0}
.rv .h{display:flex;justify-content:space-between;gap:8px;align-items:center}.rv .w2{font-size:11.5px;color:#6B6590;font-weight:700}
.rv p{font-size:14px;line-height:1.5;margin-top:6px;white-space:pre-wrap}.rv a{font-size:12.5px;font-weight:700;color:#5B3CC4}
.rv .bl{background:#F4F1FD;border-radius:12px;padding:9px 11px;font-size:13px;margin-top:8px;line-height:1.45}
.kuota{font-size:12.5px;font-weight:700;color:#6B6590;margin-bottom:12px}
.er{background:#FFF0F0;color:#C92A2A;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;margin-top:12px;display:none}
.ok{background:#EBFBEE;color:#2B8A3E;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:700;margin-top:12px}
.em{font-size:13px;color:#6B6590;text-align:center;padding:8px 0}
.pay{display:flex;justify-content:space-between;gap:10px}.pay small{display:block;font-size:11.5px;color:#6B6590;font-weight:700}.pay b{font-size:17px}
.bar{height:8px;border-radius:8px;background:#EEEAF9;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:#2E8A1F;border-radius:8px}
.ft{text-align:center;font-size:11.5px;color:#6B6590;margin-top:18px}
.ld{height:14px;border-radius:7px;background:linear-gradient(90deg,#EEEAF9,#E2DCF7,#EEEAF9);background-size:200% 100%;animation:sh 1.2s infinite;margin:10px 0}
@keyframes sh{to{background-position:-200% 0}}.hp{position:absolute;left:-9999px}
.rf{border:0;background:none;color:#5B3CC4;font-weight:800;font-size:12px;cursor:pointer;letter-spacing:0;text-transform:none}
</style>
</head>
<body>
<div class="w" id="app">
  <div class="hd"><div class="br">Portal Klien</div><h1>Memuat data…</h1><div class="ld" style="opacity:.4"></div><div class="ld" style="opacity:.4;width:70%"></div></div>
</div>
<script>
(function(){
  /* ===== GANTI kode di bawah dengan kode deployment Apps Script (bagian di antara /s/ dan /exec) ===== */
  var KODE_DEPLOYMENT="AKfycbwfbfyMvDroaUvOKPiJYqsPiZPJZiQfM6Glkmn7L0SD7XJ1kRHI1EUZzYipc6T2jnj6";
  var q=new URLSearchParams(location.search),s=(q.get("s")||(KODE_DEPLOYMENT.indexOf("ISI_")===0?"":KODE_DEPLOYMENT)).trim(),T=(q.get("t")||"").trim();
  var API=/^https:\/\//.test(s)?s.split("?")[0]:"https://script.google.com/macros/s/"+s+"/exec";
  var app=document.getElementById("app"),BLN=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
  var ST=[["Belum","#868E96","#F1F3F5"],["Proses","#16388A","#EAF0FA"],["Revisi","#E8590C","#FFF4E6"],["Selesai","#2E8A1F","#EDF8E6"]];
  var RS={"Terkirim":["#5B3CC4","#F1EDFF","Terkirim, menunggu dicek"],"Baru":["#E8590C","#FFF4E6","Diterima"],"Dikerjakan":["#16388A","#EAF0FA","Sedang dikerjakan"],"Selesai":["#2E8A1F","#EDF8E6","Selesai direvisi"],"Ditolak":["#868E96","#F1F3F5","Tidak diproses"]};
  function e(t){return String(t==null?"":t).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function tgl(k){if(!k)return"";var a=String(k).slice(0,10).split("-");if(a.length<3)return e(k);return Number(a[2])+" "+BLN[Number(a[1])-1]+" "+a[0]}
  function rp(n){return"Rp"+(Number(n)||0).toLocaleString("id-ID")}
  function gagal(m){app.innerHTML='<div class="hd"><div class="br">Portal Klien</div><h1>Portal belum bisa dibuka</h1><div class="jd">'+e(m)+'</div></div><div class="ft">Dikelola melalui Ruang Tumbuh</div>'}
  if(!s||!T){gagal("Link portal tidak lengkap. Minta link terbaru kepada pengelola.");return}
  var D=null,form=false;
  function muat(diam){if(!diam&&!D)app.firstElementChild&&0;
    fetch(API+"?aksi=klien&t="+encodeURIComponent(T)).then(function(r){return r.text()}).then(function(t){var r;try{r=JSON.parse(t)}catch(x){throw"akses"}
      if(!r.ok){if(r.pesan==="Kunci salah")throw"versi";gagal(r.pesan||"Data tidak ditemukan.");return}D=r;tampil()}).catch(function(x){gagal(x==="versi"?"Server portal belum diperbarui. Pengelola perlu menerapkan versi baru Apps Script (kode: V2).":x==="akses"?"Server portal belum dibuka untuk umum (kode: A1).":"Tidak dapat terhubung ke server. Periksa koneksi internet lalu muat ulang halaman (kode: K1).")})}
  function ring(p){var R=40,C=2*Math.PI*R;return'<svg width="96" height="96" viewBox="0 0 96 96"><circle cx="48" cy="48" r="'+R+'" stroke="rgba(255,255,255,.22)" stroke-width="9" fill="none"/><circle cx="48" cy="48" r="'+R+'" stroke="#FFD43B" stroke-width="9" fill="none" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+(C*(1-p/100))+'" transform="rotate(-90 48 48)"/></svg><b>'+p+'%</b>'}
  function tampil(){var k=D.klien,sisaH=null;if(k.tenggat){var a=k.tenggat.split("-"),d=new Date(+a[0],a[1]-1,+a[2]),n=new Date();n.setHours(0,0,0,0);sisaH=Math.round((d-n)/864e5)}
    var habis=k.kuota>0&&k.terpakai>=k.kuota,wa=D.wa?String(D.wa).replace(/\D/g,"").replace(/^0/,"62"):"";
    var h='<div class="hd"><div class="br">'+e(D.nama||"Portal Klien")+' · Portal Klien</div><h1>'+e(k.nama)+'</h1>'+(k.judul?'<div class="jd">'+e(k.judul)+'</div>':'')+
      '<div class="km">'+e([k.jenjang,k.prodi,k.kampus].filter(Boolean).join(" · "))+'</div>'+
      '<div class="top"><div class="ring">'+ring(k.progres)+'</div><div><div style="font-size:13px;font-weight:700;opacity:.9;margin-bottom:8px">Progres pengerjaan</div><div class="chips">'+
      (k.paket?'<span class="chip">'+e(k.paket)+'</span>':'')+'<span class="chip">'+e(k.status)+'</span>'+(sisaH!=null&&k.status==="Aktif"?'<span class="chip">'+(sisaH<0?"Lewat "+(-sisaH)+" hari":sisaH===0?"Target hari ini":"Target "+sisaH+" hari lagi")+'</span>':'')+'</div></div></div></div>';
    if(k.pesan)h+='<div class="msg">'+e(k.pesan)+'</div>';
    h+='<div class="cd"><div class="st">Ajukan Revisi</div><div class="kuota">'+(k.kuota?("Kuota revisi: "+k.terpakai+" dari "+k.kuota+" terpakai"):"Revisi tanpa batas · "+k.terpakai+" sudah diajukan")+'</div>'+
      (form?'<form id="f"><label>Bagian yang perlu direvisi</label><textarea name="isi" maxlength="2000" required placeholder="Contoh: Bab 2 halaman 15, tambahkan teori motivasi dari jurnal terbaru. Daftar pustaka pakai APA 7."></textarea>'+
        '<label>Deadline revisi (opsional)</label><input name="dl" type="date"><div class="hint">Tanggal revisi perlu selesai, misalnya sebelum jadwal bimbingan dengan dosen.</div><label>Link file catatan dosen (opsional)</label><input name="link" type="url" placeholder="https://drive.google.com/…"><div class="hint">Unggah foto atau file coretan dosen ke Google Drive, lalu tempel link-nya di sini.</div>'+
        '<input class="hp" name="situs" tabindex="-1" autocomplete="off"><div class="er" id="er"></div><button class="btn" id="b" style="margin-top:14px">Kirim Revisi</button><button type="button" class="btn gh" id="bt" style="margin-top:8px">Batal</button></form>'
      :'<button class="btn" id="ar" '+(habis||k.status==="Batal"?"disabled":"")+'>'+(habis?"Kuota revisi habis":"Ajukan Revisi Sekarang")+'</button>'+(habis?'<div class="hint" style="text-align:center;margin-top:8px">Hubungi pengelola untuk menambah paket revisi.</div>':''))+
      '<div id="okm"></div></div>';
    h+='<div class="cd"><div class="st">Riwayat Revisi</div>'+(k.revisi.length?k.revisi.map(function(r){var c=RS[r.status]||RS.Baru;return'<div class="rv"><div class="h"><span class="w2">'+e(r.waktu)+'</span><span class="tg" style="color:'+c[0]+';background:'+c[1]+'">'+c[2]+'</span></div><p>'+e(r.isi)+'</p>'+(r.dl||r.selesai?'<div class="w2" style="margin-top:6px">'+(r.dl?'Deadline '+tgl(r.dl):'')+(r.dl&&r.selesai?' · ':'')+(r.selesai?'Selesai '+tgl(r.selesai):'')+'</div>':'')+(r.hasil?'<a href="'+e(r.hasil)+'" target="_blank" rel="noopener" style="display:inline-block;margin:6px 12px 0 0">Buka hasil revisi</a>':'')+(r.link?'<a href="'+e(r.link)+'" target="_blank" rel="noopener">Buka file lampiran</a>':'')+(r.balas?'<div class="bl"><b>Balasan:</b> '+e(r.balas)+'</div>':'')+'</div>'}).join(""):'<div class="em">Belum ada revisi yang diajukan.</div>')+'</div>';
    h+='<div class="cd"><div class="st">Tahapan Pengerjaan <button class="rf" id="rf">Muat ulang</button></div>'+(k.tahap.length?k.tahap.map(function(t,i){var c=ST[t.s]||ST[0];return'<div class="th"><span class="no" style="color:'+c[1]+';background:'+c[2]+'">'+(t.s===3?"✓":i+1)+'</span><div class="t">'+e(t.k)+(t.tgl?'<div class="d">'+(t.s===3?"Selesai ":"Diperbarui ")+tgl(t.tgl)+'</div>':'')+'</div><span class="tg" style="color:'+c[1]+';background:'+c[2]+'">'+c[0]+'</span></div>'}).join(""):'<div class="em">Tahapan belum diatur.</div>')+'</div>';
    h+='<div class="cd"><div class="st">Lokasi Dokumen</div>'+(k.docs.length?k.docs.map(function(d){return'<a class="doc" href="'+e(d.url)+'" target="_blank" rel="noopener"><span class="i"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg></span><div><b>'+e(d.nama)+'</b><span>Ketuk untuk membuka</span></div></a>'}).join(""):'<div class="em">Link dokumen belum ditambahkan.</div>')+'</div>';
    if(k.sesi.length)h+='<div class="cd"><div class="st">Sesi Bimbingan Terakhir</div>'+k.sesi.map(function(o){return'<div class="th"><span class="no" style="color:#5B3CC4;background:#F1EDFF">•</span><div class="t">'+e(o.topik||"Bimbingan")+'<div class="d">'+tgl(o.tgl)+(o.mode?" · "+e(o.mode):"")+'</div></div></div>'}).join("")+'</div>';
    if(k.biaya){var sisa=Math.max(0,k.biaya-k.dibayar);h+='<div class="cd"><div class="st">Pembayaran</div><div class="pay"><div><small>Sudah dibayar</small><b style="color:#2E8A1F">'+rp(k.dibayar)+'</b></div><div style="text-align:right"><small>'+(sisa?"Sisa":"Status")+'</small><b style="color:'+(sisa?"#C25E00":"#2E8A1F")+'">'+(sisa?rp(sisa):"Lunas")+'</b></div></div><div class="bar"><i style="width:'+Math.min(100,k.dibayar/k.biaya*100)+'%"></i></div>'+
      '<div class="th" style="margin-top:10px"><div class="t">Total biaya</div><b>'+rp(k.biaya)+'</b></div>'+
      ((k.bayar||[]).length?'<div class="st" style="margin-top:14px;font-size:13px">Rincian pembayaran</div>'+k.bayar.map(function(b){return'<div class="th"><span class="no" style="color:#2E8A1F;background:#EDF8E6">✓</span><div class="t">'+e(b.ket||"Pembayaran")+'<div class="d">'+tgl(b.tgl)+'</div></div><b style="color:#2E8A1F">'+rp(b.jml)+'</b></div>'}).join(""):'<div class="em">Belum ada pembayaran yang tercatat.</div>')+'</div>'}
    if(wa)h+='<a class="btn wa" href="https://wa.me/'+wa+'?text='+encodeURIComponent("Halo, saya "+k.nama+" (klien projek). ")+'" target="_blank" rel="noopener">Hubungi Pengelola via WhatsApp</a>';
    h+='<div class="ft">Dikelola melalui Ruang Tumbuh · data diperbarui saat pengelola menyinkronkan aplikasi</div>';
    app.innerHTML=h;
    var rf=document.getElementById("rf");if(rf)rf.onclick=function(){rf.textContent="Memuat…";muat(true)};
    var ar=document.getElementById("ar");if(ar)ar.onclick=function(){form=true;tampil();var f=document.getElementById("f");f.isi.focus()};
    var f=document.getElementById("f");if(f){document.getElementById("bt").onclick=function(){form=false;tampil()};
      f.onsubmit=function(ev){ev.preventDefault();var b=document.getElementById("b"),er=document.getElementById("er");er.style.display="none";b.disabled=true;b.textContent="Mengirim…";
        fetch(API,{method:"POST",body:JSON.stringify({aksi:"revisi",t:T,isi:f.isi.value,link:f.link.value,dl:f.dl.value,situs:f.situs.value})}).then(function(r){return r.json()}).then(function(r){
          if(!r||!r.ok){er.textContent=(r&&r.pesan)||"Gagal mengirim";er.style.display="block";b.disabled=false;b.textContent="Kirim Revisi";return}
          form=false;muat(true);setTimeout(function(){var o=document.getElementById("okm");if(o)o.innerHTML='<div class="ok">Revisi terkirim dan langsung masuk ke daftar pengerjaan. Terima kasih.</div>'},900)
        }).catch(function(){er.textContent="Gagal mengirim. Periksa koneksi lalu coba lagi.";er.style.display="block";b.disabled=false;b.textContent="Kirim Revisi"})}}
  }
  muat();
})();
</script>
</body>
</html>
