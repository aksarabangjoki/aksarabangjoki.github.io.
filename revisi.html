.ft{text-align:center;font-size:11.5px;color:#55617A;margin-top:16px}.hp{position:absolute;left:-9999px}

body.rv .hd{background:linear-gradient(135deg,#1F1454,#4530B0 55%,#6B4FE0)}

.hd{transition:background .3s}
</style>

  function chips(id,list,warn){return'<div class="chips" id="'+id+'">'+list.map(function(v){return'<button type="button" data-v="'+e(v)+'"'+(warn===v?' data-w="1"':'')+'>'+e(v)+'</button>'}).join("")+'</div>'}

  var DATA='<label>Nama Lengkap <i>*</i></label><input name="nama" required maxlength="80" placeholder="Nama Anda"><label>Nomor HP / WhatsApp <i>*</i></label><input name="hp" type="tel" inputmode="tel" required maxlength="16" placeholder="08xxxxxxxxxx">';

    [].forEach.call(pl.querySelectorAll("button"),function(b){b.onclick=function(){if(mode===b.dataset.m)return;mode=b.dataset.m;tampil();var y=pl.getBoundingClientRect().top+window.pageYOffset-10;window.scrollTo({top:y,behavior:"smooth"})}})}

    var f=G("f"),P={ke:"",dari:"",tk:"Biasa"},t=new Date(),N=rv?3:2,sp=G("sp"),i;t.setMinutes(t.getMinutes()-t.getTimezoneOffset());f.tenggat.min=t.toISOString().slice(0,10);

       if(!P.dari)return salah(G("dari"),"Pilih asal permintaan revisi.");
       if(!f.bagian.value.trim())return salah(f.bagian,"Tuliskan bagian yang direvisi.");
       if(f.catatan.value.trim().length<5)return salah(f.catatan,"Catatan revisi wajib diisi.");
       if(f.link.value.trim()&&!/^https?:\/\/\S+\.\S+/.test(f.link.value.trim()))return salah(f.link,"Link harus diawali https://")}
      if(!f.tenggat.value)return salah(f.tenggat,"Tenggat waktu wajib diisi.");
      if(f.tenggat.value<f.tenggat.min)return salah(f.tenggat,"Tenggat tidak boleh tanggal yang sudah lewat.");
      if(rv&&!G("stj").checked)return salah(null,"Centang pernyataan di atas tombol kirim.");
      return true}
    f.onsubmit=function(ev){ev.preventDefault();var b=G("b"),er=G("er");er.style.display="none";if(!periksa())return;
      var d,R,msg,jdl,sub,tb,nama=f.nama.value.trim();
      if(rv){var ke=P.ke.replace(" atau lebih","+"),lk=f.link.value.trim(),jam=f.jam.value;
        var detail="REVISI KE-"+ke+(P.tk==="Mendesak"?" · MENDESAK":"")+"\nJudul: "+f.judul.value.trim()+"\nDari: "+P.dari+"\nBagian: "+f.bagian.value.trim()+(jam?"\nJam tenggat: "+jam:"")+"\nCatatan: "+f.catatan.value.trim()+(lk?"\nFile: "+lk:"");
        d={aksi:"pesan",nama:nama,hp:f.hp.value.trim(),jenis:("Revisi - "+f.jenis.value).slice(0,80),tenggat:f.tenggat.value,detail:detail.slice(0,1000),situs:f.situs.value};
        R=[["Nama",nama],["Tugas",f.jenis.value+" · "+f.judul.value.trim()],["Revisi ke",ke+(P.tk==="Mendesak"?" (mendesak)":"")],["Bagian",f.bagian.value.trim()],["Tenggat",tgl(d.tenggat)+(jam?" pukul "+jam:"")]];
        msg="Halo Admin, saya "+nama+" baru saja mengajukan *revisi ke-"+ke+"* untuk "+f.jenis.value+" \""+f.judul.value.trim()+"\".\n\nBagian: "+f.bagian.value.trim()+"\nTenggat: "+tgl(d.tenggat)+(jam?" pukul "+jam:"")+"{kode}\n\nFile atau catatan revisi saya kirim di chat ini.";
        jdl="Permintaan Revisi Terkirim";sub="Revisi sudah masuk antrean dan admin akan menghubungi lewat WhatsApp.";tb="Kirim File Revisi lewat WhatsApp"}
      else{d={aksi:"pesan",nama:nama,hp:f.hp.value.trim(),jenis:f.jenis.value,tenggat:f.tenggat.value,detail:f.detail.value.trim(),situs:f.situs.value};
        R=[["Nama",nama],["Jenis tugas",d.jenis],["Tenggat",tgl(d.tenggat)]];if(d.detail)R.push(["Detail",d.detail.length>140?d.detail.slice(0,140)+"…":d.detail]);
        msg="Halo, saya "+nama+" baru saja memesan "+d.jenis+" dengan tenggat "+tgl(d.tenggat)+".{kode}";
        jdl="Pesanan Terkirim";sub="Pesanan "+d.jenis+" sudah kami terima dan admin akan menghubungi lewat WhatsApp.";tb="Konfirmasi lewat WhatsApp"}
      b.disabled=true;b.textContent="Mengirim…";simpan("rv_nama",d.nama);simpan("rv_hp",d.hp);
      fetch(API,{method:"POST",body:JSON.stringify(d)}).then(function(r){return r.json()}).then(function(r){
        if(!r||!r.ok){er.textContent=(r&&r.pesan)||"Gagal mengirim";er.style.display="block";b.disabled=false;b.textContent=KIRIM;return}
        var wa=r.wa?String(r.wa).replace(/\D/g,"").replace(/^0/,"62"):"";msg=msg.replace("{kode}",r.id?"\nKode: "+r.id:"");G("pl").innerHTML="";
        kotak('<div class="ok"><div class="ic">'+CHK+'</div><h2>'+jdl+'</h2><p>Terima kasih, '+e(nama.split(" ")[0])+'. '+e(sub)+'</p>'+
          '<div class="sum">'+R.map(function(x){return"<div><span>"+x[0]+"</span><b>"+e(x[1])+"</b></div>"}).join("")+(r.id?"<div><span>Kode</span><b>"+e(r.id)+"</b></div>":"")+'</div>'+
          (wa?'<a class="wa" href="https://wa.me/'+wa+'?text='+encodeURIComponent(msg)+'">'+tb+'</a>':'')+'<button class="lagi" id="lg">Isi Formulir Lagi</button></div>');
        G("lg").onclick=function(){mode="";tampil();window.scrollTo(0,0)};window.scrollTo({top:0,behavior:"smooth"});
      }).catch(function(){er.textContent="Gagal mengirim. Periksa koneksi lalu coba lagi.";er.style.display="block";b.disabled=false;b.textContent=KIRIM})};
  }
  fetch(API+"?aksi=jasaInfo").then(function(r){return r.text()}).then(function(t){var r;try{r=JSON.parse(t)}catch(x){throw"akses"}
    if(!r.ok||!r.config)throw"versi";C=r.config;tampil();
  }).catch(function(x){gagal(x==="versi"?"Server formulir belum diperbarui. Admin perlu menerapkan versi baru Apps Script (kode: V1).":x==="akses"?"Server formulir belum dibuka untuk umum. Admin perlu mengatur akses Web App ke Siapa saja (kode: A1).":"Tidak dapat terhubung ke server. Periksa koneksi internet lalu muat ulang halaman (kode: K1).")});
})();
</script>
