<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0B1E4A">
<title>Form Revisi Tugas By Aksara Bangjoki</title>
<meta property="og:title" content="Form Revisi Tugas By Aksara Bangjoki">
<meta property="og:description" content="Ajukan revisi tugas: isi data pesanan, bagian yang direvisi dan catatan revisinya.">
<meta name="description" content="Ajukan revisi tugas: isi data pesanan, bagian yang direvisi dan catatan revisinya.">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Plus Jakarta Sans",system-ui,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#EEF2F9;color:#0F1B33;min-height:100vh;padding:22px 14px 40px}
.w{max-width:520px;margin:0 auto}
.hd{background:linear-gradient(135deg,#0B1E4A,#1E3A8A 55%,#2F5DA8);color:#fff;border-radius:26px;padding:24px 22px 22px;position:relative;overflow:hidden;box-shadow:0 18px 40px -18px rgba(10,20,45,.6)}
.hd:before{content:"";position:absolute;right:-50px;top:-60px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.07)}
.hd:after{content:"";position:absolute;right:40px;bottom:-70px;width:140px;height:140px;border-radius:50%;background:rgba(229,181,63,.16)}
.hd>*{position:relative}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.ic{width:52px;height:52px;border-radius:16px;background:#E5B53F;color:#1A1300;display:grid;place-items:center;flex:none}
.ic svg{animation:putar 9s linear infinite}
@keyframes putar{to{transform:rotate(-360deg)}}
.bdg{font-size:11.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;background:rgba(255,255,255,.16);padding:6px 11px;border-radius:99px}
h1{font-size:23px;font-weight:800;line-height:1.25}
.hd p{font-size:13.5px;opacity:.9;margin-top:6px;line-height:1.5}
.steps{display:flex;gap:6px;margin-top:16px}
.steps span{flex:1;height:5px;border-radius:5px;background:rgba(255,255,255,.22);transition:background .3s}
.steps span.on{background:#E5B53F}
.stx{font-size:12px;font-weight:700;opacity:.9;margin-top:8px}
.cd{background:#fff;border-radius:22px;padding:20px;margin-top:14px;box-shadow:0 10px 30px -18px rgba(10,20,45,.4);animation:naik .45s both}
.cd:nth-of-type(3){animation-delay:.07s}.cd:nth-of-type(4){animation-delay:.14s}.cd:nth-of-type(5){animation-delay:.21s}
@keyframes naik{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.st{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.no{width:30px;height:30px;border-radius:10px;background:#EAF0FA;color:#1E3A8A;font-weight:800;font-size:14px;display:grid;place-items:center;flex:none;transition:.25s}
.cd.done .no{background:#2B8A3E;color:#fff}
.st b{font-size:16px;font-weight:800}.st small{display:block;font-size:12px;color:#55617A;font-weight:600;margin-top:1px}
label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}label i{color:#E03131;font-style:normal}label em{font-style:normal;font-weight:600;color:#8490A6}
input,select,textarea{width:100%;padding:13px 14px;border:1.5px solid #D9E2F1;border-radius:13px;font-size:15px;background:#fff;outline:none;color:#0F1B33;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:#1E3A8A;box-shadow:0 0 0 3px rgba(30,58,138,.15)}
.bad{border-color:#E03131!important;box-shadow:0 0 0 3px rgba(224,49,49,.12)!important}
textarea{min-height:120px;resize:vertical;line-height:1.5}
.hint{font-size:12px;color:#55617A;margin-top:5px;line-height:1.45}
.cnt{display:flex;justify-content:space-between;gap:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1.5px solid #D9E2F1;background:#fff;color:#0F1B33;font-size:13.5px;font-weight:700;padding:10px 14px;border-radius:99px;cursor:pointer;transition:.15s}
.chips button:active{transform:scale(.95)}
.chips button.on{background:#1E3A8A;border-color:#1E3A8A;color:#fff;box-shadow:0 6px 14px -8px rgba(30,58,138,.9)}
.chips button.on.warn{background:#E8590C;border-color:#E8590C;box-shadow:0 6px 14px -8px rgba(232,89,12,.9)}
.tip{background:#FFF9E6;border:1.5px dashed #E5B53F;border-radius:14px;padding:12px 14px;font-size:12.5px;line-height:1.55;color:#5C4500;margin-top:14px}
.tip b{display:block;margin-bottom:3px;color:#3D2E00}
.tip a{color:#1E3A8A;font-weight:800}
.sum{background:#F4F7FC;border-radius:14px;padding:4px 14px;margin-top:6px}
.sum div{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #E3E9F4;font-size:13px}
.sum div:last-child{border:0}.sum span{color:#55617A;flex:none;width:96px}.sum b{font-weight:700;min-width:0;word-break:break-word;white-space:pre-wrap}
.cek{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:13px;font-weight:600;line-height:1.45;cursor:pointer}
.cek input{width:20px;height:20px;flex:none;margin-top:1px;accent-color:#1E3A8A}
.kirim{width:100%;margin-top:18px;padding:16px;border:0;border-radius:15px;background:linear-gradient(135deg,#1E3A8A,#2F5DA8);color:#fff;font-size:15.5px;font-weight:800;cursor:pointer;box-shadow:0 12px 24px -14px rgba(30,58,138,.9);transition:transform .12s}
.kirim:active{transform:scale(.98)}.kirim:disabled{opacity:.6}
.er{background:#FFF0F0;color:#C92A2A;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;margin-top:14px;display:none}
.ok{text-align:center;padding:10px 0}
.ok .ic{margin:0 auto 14px;background:#EBFBEE;color:#2B8A3E;width:76px;height:76px;border-radius:50%;animation:pop .5s cubic-bezier(.2,1.5,.4,1) both}
.ok .ic svg{animation:none}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.ok h2{font-size:20px}.ok p{color:#55617A;font-size:14px;margin-top:8px;line-height:1.55}
.ok .sum{text-align:left;margin-top:16px}
.wa{display:block;margin-top:18px;padding:15px;border-radius:14px;background:#1FAF54;color:#fff;font-weight:800;text-decoration:none}
.lagi{display:block;margin-top:10px;padding:13px;border-radius:14px;background:#EAF0FA;color:#1E3A8A;font-weight:800;text-decoration:none;border:0;width:100%;font-size:14.5px;cursor:pointer}
.ft{text-align:center;font-size:11.5px;color:#55617A;margin-top:16px}.hp{position:absolute;left:-9999px}
.ld{height:14px;border-radius:7px;background:linear-gradient(90deg,#EEF2F9,#E2E8F3,#EEF2F9);background-size:200% 100%;animation:sh 1.2s infinite;margin:10px 0}
@keyframes sh{to{background-position:-200% 0}}
@media(max-width:380px){.g2{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="w">
  <div class="hd">
    <div class="top"><div class="ic"><svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15.5-6.3L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.3L3 16"/><path d="M3 21v-5h5"/></svg></div><span class="bdg">Khusus Revisi</span></div>
    <h1 id="jd">Form Revisi Tugas</h1><p id="ds">Memuat formulir…</p>
    <div class="steps" id="sp"><span></span><span></span><span></span></div><div class="stx" id="sx"></div>
  </div>
  <div id="isi"><div class="cd"><div class="ld"></div><div class="ld" style="width:70%"></div><div class="ld" style="width:85%"></div></div></div>
  <div class="ft">Dikelola melalui Ruang Tumbuh</div>
</div>
<script>
(function(){
  /* ===== GANTI kode di bawah dengan kode deployment Apps Script (bagian di antara /s/ dan /exec) ===== */
  var KODE_DEPLOYMENT="AKfycbwfbfyMvDroaUvOKPiJYqsPiZPJZiQfM6Glkmn7L0SD7XJ1kRHI1EUZzYipc6T2jnj6";
  /* Tautan syarat dan ketentuan revisi */
  var LINK_SK="https://drive.google.com/file/d/13neoInNoLh5e_cUvsdLjkZwPjyib6VMi/view?usp=drive_link";
  var q=new URLSearchParams(location.search),s=(q.get("s")||(KODE_DEPLOYMENT.indexOf("ISI_")===0?"":KODE_DEPLOYMENT)).trim();
  var API=/^https:\/\//.test(s)?s.split("?")[0]:"https://script.google.com/macros/s/"+s+"/exec";
  var isi=document.getElementById("isi"),G=function(i){return document.getElementById(i)};
  function e(t){return String(t).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function kotak(h){isi.innerHTML='<div class="cd">'+h+'</div>';G("sp").style.display="none";G("sx").textContent=""}
  function gagal(m){kotak('<div class="ok"><h2>Formulir belum bisa dibuka</h2><p>'+e(m)+'</p></div>');G("ds").textContent=""}
  function tgl(k){var a=k.split("-"),B=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];return a.length===3?Number(a[2])+" "+B[Number(a[1])-1]+" "+a[0]:k}
  function simpan(k,v){try{localStorage.setItem(k,v)}catch(x){}}function ambil(k){try{return localStorage.getItem(k)||""}catch(x){return""}}
  if(!s){gagal("Link formulir tidak lengkap. Minta link terbaru kepada admin.");return}
  var CHK='<svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>';
  function chips(id,list,warn){return'<div class="chips" id="'+id+'">'+list.map(function(v){return'<button type="button" data-v="'+e(v)+'"'+(warn===v?' data-w="1"':'')+'>'+e(v)+'</button>'}).join("")+'</div>'}

  function tampil(c){
    document.title="Form Revisi · "+c.nama;G("jd").textContent="Form Revisi Tugas";
    G("ds").textContent="Ajukan revisi untuk tugas yang sudah dikerjakan "+c.nama+". Isi tiga bagian singkat di bawah ini.";
    if(!c.buka){kotak('<div class="ok"><h2>Pengajuan revisi sedang ditutup</h2><p>Silakan hubungi admin kembali nanti.</p></div>');return}
    isi.innerHTML='<form id="f" autocomplete="on" novalidate>'+
     '<div class="cd" data-s="1"><div class="st"><span class="no">1</span><div><b>Data Pesanan</b><small>Samakan dengan data saat memesan</small></div></div>'+
      '<label>Nama Lengkap <i>*</i></label><input name="nama" required maxlength="80" placeholder="Nama saat memesan">'+
      '<label>Nomor HP / WhatsApp <i>*</i></label><input name="hp" type="tel" inputmode="tel" required maxlength="16" placeholder="08xxxxxxxxxx">'+
      '<label>Jenis Tugas yang Direvisi <i>*</i></label><select name="jenis" required><option value="">Pilih jenis tugas</option>'+c.jenis.map(function(j){return"<option>"+e(j)+"</option>"}).join("")+'</select>'+
      '<label>Judul / Nama Tugas <i>*</i></label><input name="judul" required maxlength="120" placeholder="mis. Makalah Kewirausahaan Bab 1–3">'+
     '</div>'+
     '<div class="cd" data-s="2"><div class="st"><span class="no">2</span><div><b>Rincian Revisi</b><small>Semakin jelas, semakin cepat selesai</small></div></div>'+
      '<label>Revisi ke- <i>*</i></label>'+chips("ke",["1","2","3","4 atau lebih"])+
      '<label>Permintaan Revisi dari <i>*</i></label>'+chips("dari",["Dosen / Guru","Pembimbing","Penguji","Saya sendiri"])+
      '<label>Bagian yang Direvisi <i>*</i></label><input name="bagian" required maxlength="150" placeholder="mis. Bab 2 halaman 5–7, daftar pustaka">'+
      '<label>Catatan Revisi <i>*</i></label><textarea name="catatan" required maxlength="450" placeholder="Tuliskan apa saja yang perlu diperbaiki. Satu poin per baris akan lebih mudah dibaca."></textarea>'+
      '<div class="hint cnt"><span>Salin catatan dari dosen atau guru apa adanya bila ada</span><b id="ct">0/450</b></div>'+
      '<label>Link File / Catatan Revisi <em>(opsional)</em></label><input name="link" type="url" inputmode="url" maxlength="200" placeholder="https://drive.google.com/…">'+
      '<div class="hint">Tempel link Google Drive berisi file coretan atau foto catatan. Pastikan aksesnya "Siapa saja yang memiliki link". File juga bisa dikirim lewat WhatsApp setelah formulir terkirim.</div>'+
     '</div>'+
     '<div class="cd" data-s="3"><div class="st"><span class="no">3</span><div><b>Waktu Pengerjaan</b><small>Kapan revisi harus selesai</small></div></div>'+
      '<div class="g2"><div><label>Tenggat Revisi <i>*</i></label><input name="tenggat" type="date" required></div><div><label>Jam <em>(opsional)</em></label><input name="jam" type="time"></div></div>'+
      '<label>Tingkat Kebutuhan <i>*</i></label>'+chips("tk",["Biasa","Mendesak"],"Mendesak")+
      '<div class="tip"><b>Ketentuan revisi</b>Revisi gratis berlaku 1 kali sesuai syarat yang berlaku. Revisi di luar ketentuan atau perubahan isi yang besar dapat dikenai biaya tambahan dan akan dikonfirmasi admin lebih dulu. <a href="'+LINK_SK+'" target="_blank" rel="noopener">Baca syarat dan ketentuan</a></div>'+
      '<label class="cek"><input type="checkbox" id="stj"><span>Data yang saya isi sudah benar dan saya memahami ketentuan revisi.</span></label>'+
      '<input class="hp" name="situs" tabindex="-1" autocomplete="off"><div class="er" id="er"></div><button class="kirim" id="b">Kirim Permintaan Revisi</button>'+
     '</div></form>';
    var f=G("f"),P={ke:"",dari:"",tk:"Biasa"},t=new Date();t.setMinutes(t.getMinutes()-t.getTimezoneOffset());f.tenggat.min=t.toISOString().slice(0,10);
    f.nama.value=ambil("rv_nama");f.hp.value=ambil("rv_hp");
    ["ke","dari","tk"].forEach(function(id){var box=G(id);[].forEach.call(box.children,function(b){
      if(P[id]===b.dataset.v)b.className="on";
      b.onclick=function(){P[id]=b.dataset.v;[].forEach.call(box.children,function(x){x.className=""});b.className="on"+(b.dataset.w?" warn":"");box.classList.remove("bad");maju()}})});
    function lengkap(n){if(n===1)return f.nama.value.trim().length>1&&f.hp.value.replace(/\D/g,"").length>=9&&f.jenis.value&&f.judul.value.trim();
      if(n===2)return P.ke&&P.dari&&f.bagian.value.trim()&&f.catatan.value.trim().length>=5;return!!f.tenggat.value&&G("stj").checked}
    function maju(){var n=0;[1,2,3].forEach(function(i){var ok=lengkap(i);if(ok)n++;f.querySelector('[data-s="'+i+'"]').classList.toggle("done",!!ok);G("sp").children[i-1].className=ok?"on":""});
      G("sx").textContent=n===3?"Siap dikirim":n+" dari 3 bagian terisi";G("ct").textContent=f.catatan.value.length+"/450"}
    f.addEventListener("input",function(ev){if(ev.target.classList)ev.target.classList.remove("bad");maju()});f.addEventListener("change",maju);maju();
    function salah(el,m){var er=G("er");er.textContent=m;er.style.display="block";if(el){el.classList.add("bad");el.scrollIntoView({behavior:"smooth",block:"center"});if(el.focus&&el.tagName!=="DIV")try{el.focus({preventScroll:true})}catch(x){}}return false}
    function periksa(){
      if(f.nama.value.trim().length<2)return salah(f.nama,"Nama lengkap wajib diisi.");
      if(f.hp.value.replace(/\D/g,"").length<9)return salah(f.hp,"Nomor HP belum benar.");
      if(!f.jenis.value)return salah(f.jenis,"Pilih jenis tugas yang direvisi.");
      if(!f.judul.value.trim())return salah(f.judul,"Judul atau nama tugas wajib diisi.");
      if(!P.ke)return salah(G("ke"),"Pilih revisi ke berapa.");
      if(!P.dari)return salah(G("dari"),"Pilih asal permintaan revisi.");
      if(!f.bagian.value.trim())return salah(f.bagian,"Tuliskan bagian yang direvisi.");
      if(f.catatan.value.trim().length<5)return salah(f.catatan,"Catatan revisi wajib diisi.");
      if(f.link.value.trim()&&!/^https?:\/\/\S+\.\S+/.test(f.link.value.trim()))return salah(f.link,"Link harus diawali https://");
      if(!f.tenggat.value)return salah(f.tenggat,"Tenggat revisi wajib diisi.");
      if(f.tenggat.value<f.tenggat.min)return salah(f.tenggat,"Tenggat tidak boleh tanggal yang sudah lewat.");
      if(!G("stj").checked)return salah(null,"Centang pernyataan di atas tombol kirim.");
      return true}
    f.onsubmit=function(ev){ev.preventDefault();var b=G("b"),er=G("er");er.style.display="none";if(!periksa())return;
      var ke=P.ke.replace(" atau lebih","+"),lk=f.link.value.trim(),jam=f.jam.value;
      var detail="REVISI KE-"+ke+(P.tk==="Mendesak"?" · MENDESAK":"")+"\nJudul: "+f.judul.value.trim()+"\nDari: "+P.dari+"\nBagian: "+f.bagian.value.trim()+(jam?"\nJam tenggat: "+jam:"")+"\nCatatan: "+f.catatan.value.trim()+(lk?"\nFile: "+lk:"");
      var d={aksi:"pesan",nama:f.nama.value.trim(),hp:f.hp.value.trim(),jenis:("Revisi - "+f.jenis.value).slice(0,80),tenggat:f.tenggat.value,detail:detail.slice(0,1000),situs:f.situs.value};
      var R=[["Nama",d.nama],["Tugas",f.jenis.value+" · "+f.judul.value.trim()],["Revisi ke",ke+(P.tk==="Mendesak"?" (mendesak)":"")],["Bagian",f.bagian.value.trim()],["Tenggat",tgl(d.tenggat)+(jam?" pukul "+jam:"")]];
      b.disabled=true;b.textContent="Mengirim…";simpan("rv_nama",d.nama);simpan("rv_hp",d.hp);
      fetch(API,{method:"POST",body:JSON.stringify(d)}).then(function(r){return r.json()}).then(function(r){
        if(!r||!r.ok){er.textContent=(r&&r.pesan)||"Gagal mengirim";er.style.display="block";b.disabled=false;b.textContent="Kirim Permintaan Revisi";return}
        var wa=r.wa?String(r.wa).replace(/\D/g,"").replace(/^0/,"62"):"";
        var msg="Halo Admin, saya "+d.nama+" baru saja mengajukan *revisi ke-"+ke+"* untuk "+f.jenis.value+" \""+f.judul.value.trim()+"\".\n\nBagian: "+f.bagian.value.trim()+"\nTenggat: "+tgl(d.tenggat)+(jam?" pukul "+jam:"")+(r.id?"\nKode: "+r.id:"")+"\n\nFile atau catatan revisi saya kirim di chat ini.";
        kotak('<div class="ok"><div class="ic">'+CHK+'</div><h2>Permintaan Revisi Terkirim</h2><p>Terima kasih, '+e(d.nama.split(" ")[0])+'. Revisi sudah masuk antrean dan admin akan menghubungi lewat WhatsApp.</p>'+
          '<div class="sum">'+R.map(function(x){return"<div><span>"+x[0]+"</span><b>"+e(x[1])+"</b></div>"}).join("")+(r.id?"<div><span>Kode</span><b>"+e(r.id)+"</b></div>":"")+'</div>'+
          (wa?'<a class="wa" href="https://wa.me/'+wa+'?text='+encodeURIComponent(msg)+'">Kirim File Revisi lewat WhatsApp</a>':'')+'<button class="lagi" id="lg">Ajukan Revisi Lain</button></div>');
        G("lg").onclick=function(){G("sp").style.display="";tampil(c);window.scrollTo(0,0)};window.scrollTo({top:0,behavior:"smooth"});
      }).catch(function(){er.textContent="Gagal mengirim. Periksa koneksi lalu coba lagi.";er.style.display="block";b.disabled=false;b.textContent="Kirim Permintaan Revisi"})};
  }
  fetch(API+"?aksi=jasaInfo").then(function(r){return r.text()}).then(function(t){var r;try{r=JSON.parse(t)}catch(x){throw"akses"}
    if(!r.ok||!r.config)throw"versi";tampil(r.config);
  }).catch(function(x){gagal(x==="versi"?"Server formulir belum diperbarui. Admin perlu menerapkan versi baru Apps Script (kode: V1).":x==="akses"?"Server formulir belum dibuka untuk umum. Admin perlu mengatur akses Web App ke Siapa saja (kode: A1).":"Tidak dapat terhubung ke server. Periksa koneksi internet lalu muat ulang halaman (kode: K1).")});
})();
</script>
</body>
</html>
